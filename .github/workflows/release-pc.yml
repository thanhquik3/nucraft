name: Build and Release NUCRAFT PC App
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        default: 'v1.0.124'
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify syntax and build standalone NUCRAFT.exe
        shell: pwsh
        run: |
          node --check server.js
          node --check scripts/build.js
          node --check sw.js
          node scripts/build.js
      - name: Isolated self-test in empty directory
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'iso_test'
          New-Item -ItemType Directory -Path $iso -Force | Out-Null
          Copy-Item .\NUCRAFT.exe (Join-Path $iso 'NUCRAFT.exe') -Force
          $rep = Join-Path $iso 'report.txt'
          $p = Start-Process -FilePath (Join-Path $iso 'NUCRAFT.exe') -ArgumentList "--self-test=$rep" -WorkingDirectory $iso -Wait -PassThru
          $txt = Get-Content $rep -Raw
          Write-Host "Self-test ($($p.ExitCode)): $txt"
          if ($p.ExitCode -ne 0 -or $txt -notmatch '^OK\|.*httpChecks=PASS\|hasBadCacheFlag=False') {
            throw "Self-test failed: $txt"
          }
      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\NUCRAFT.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NUCRAFT.exe" | Set-Content -Path .\SHA256SUMS.txt -Encoding ASCII
          Get-Content .\SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: NUCRAFT.exe
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REL_TAG
          if (-not $tag -or $tag -eq 'main') { $tag = 'v1.0.124' }
          $hashLine = Get-Content .\SHA256SUMS.txt -Raw
          $notes = "NUCRAFT Windows PC App ($tag) - built reproducibly from public source on GitHub Actions (windows-latest).`n`nSHA-256:`n$hashLine"
          $exists = $false
          try { gh release view $tag 2>&1 | Out-Null; if ($LASTEXITCODE -eq 0) { $exists = $true } } catch { $exists = $false }
          if ($exists) {
            gh release upload $tag ".\NUCRAFT.exe#NUCRAFT.exe" ".\SHA256SUMS.txt#SHA256SUMS.txt" --clobber
            gh release edit $tag --latest --title "NUCRAFT $tag - Windows PC App (.EXE)" --notes $notes
          } else {
            gh release create $tag ".\NUCRAFT.exe#NUCRAFT.exe" ".\SHA256SUMS.txt#SHA256SUMS.txt" --latest --title "NUCRAFT $tag - Windows PC App (.EXE)" --notes $notes
          }
