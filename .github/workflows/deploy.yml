name: Build and Deploy NUCRAFT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web bundle from source
        run: node scripts/build.js --no-exe
      - name: Stage static web files
        run: |
          mkdir -p _site/css _site/shared _site/src/world _site/assets
          cp index.html NUCRAFT.html manifest.json sw.js _site/
          cp -r css/. _site/css/
          cp -r shared/. _site/shared/
          cp src/config.js _site/src/
          cp src/world/chunkWorker.js _site/src/world/
          cp -r assets/. _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
