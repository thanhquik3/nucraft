name: CI Policy & Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web bundle from source
        run: node scripts/build.js --no-exe
      - name: Policy, syntax, and security checks
        run: node scripts/ci-check.js --with-build --git-tracked
