name: CI Policy & Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build web bundle from source
        run: node scripts/build.js --no-exe
      - name: Run Rust/WASM parity & integrity tests
        run: |
          node scripts/test-wasm.js
          if command -v cargo >/dev/null 2>&1; then cargo check --manifest-path rust/nucraft_core/Cargo.toml; fi
      - name: Policy, syntax, and security checks
        run: node scripts/ci-check.js --with-build --git-tracked
